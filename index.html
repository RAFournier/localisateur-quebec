<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title> Linux Ubuntu </title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f5;
color:#263747
}

header{
background:#173d60;
color:white;
text-align:center;
padding:22px 10px
}

header h1{margin:0;font-size:25px}

.container{
max-width:1250px;
margin:auto;
padding:15px
}

.panel{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:9px;
box-shadow:0 2px 6px #ccc
}

h2,h3{color:#173d60}

input,select,textarea{
display:block;
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #aaa;
border-radius:5px;
font-size:15px
}

button{
background:#1769aa;
color:white;
border:0;
border-radius:5px;
padding:12px 16px;
margin:5px 3px;
cursor:pointer;
font-weight:bold
}

button:hover{background:#104b7c}
button:disabled{background:#999;cursor:wait}

.green{background:#25843a}
.red{background:#b52b2b}
.orange{background:#bd7915}

.message{
background:#f0f3f5;
padding:12px;
border-radius:5px;
margin-top:10px;
line-height:1.6;
overflow-wrap:anywhere
}

.resultat{
display:none;
background:#e5f5e7;
border-left:6px solid #299a40;
padding:16px;
margin-top:15px;
line-height:1.7
}

.resultat .adresse{
font-size:20px;
font-weight:bold;
color:#173d60
}

.resultat .distance{
font-size:16px;
color:#25843a;
font-weight:bold
}

#map{
height:570px;
width:100%;
border-radius:8px;
background:#ddd
}

.admin[hidden]{display:none!important}

.point{
border-bottom:1px solid #ddd;
padding:12px 4px;
overflow-wrap:anywhere
}

.small{font-size:12px;color:#666}

footer{
text-align:center;
padding:20px;
color:#666
}

@media(max-width:600px){
#map{height:430px}
header h1{font-size:20px}
button{width:100%;margin:5px 0}
}
</style>


<footer>
<p></p>

<br> OS Linux Ubuntu <br>

</footer>

</html
